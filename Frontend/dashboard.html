<!DOCTYPE html>
<html lang="pt-br">
<head>
<script>
  if (!localStorage.getItem("token")) {
      window.location.replace("login.html");
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSpot - Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
<header class="app-topbar">
    <div class="app-topbar-inner">
        <button id="openMenuBtn" class="menu-trigger-btn icon-btn nav" title="Abrir menu" aria-label="Abrir menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="hero-copy app-topbar-title">
            <h1>Dashboard</h1>
        </div>
        <a class="toolbar-link-btn icon-btn nav" href="incidents.html" title="Abrir histórico completo de incidentes" aria-label="Abrir histórico completo de incidentes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
        </a>
    </div>
</header>
<div class="container app-content">

<section class="panel-section">
    <article class="overview-card">
        <h2>Resumo da Rede</h2>
        <div id="dashboardSummary" class="summary-grid"></div>
    </article>
</section>

<section class="panel-section">
    <article class="overview-card">
        <h2>Cadastrar Host</h2>
        <form id="hostForm">
            <input id="name" placeholder="Nome" required>
            <input id="address" placeholder="Endereço/IP" required>
            <input id="http_url" placeholder="URL HTTP (opcional)">
            <label class="snmp-enable-field snmp-enable-switch">
                <input id="http_enabled" type="checkbox" checked>
                <span class="snmp-switch" aria-hidden="true"></span>
                <span class="snmp-enable-text">
                    <strong>Check HTTP/HTTPS</strong>
                    <small>Ativa monitoramento web</small>
                </span>
            </label>
            <div id="portsField" class="ports-field">
              <div class="ports-field-head">
                <span>Portas TCP</span>
                <button id="addPortBtn" type="button" class="add-port-btn" title="Adicionar porta" aria-label="Adicionar porta">+</button>
              </div>
              <small class="ports-help">Informe apenas portas TCP que deseja monitorar.</small>
              <div id="portsContainer" class="ports-container"></div>
            </div>
            <label class="snmp-enable-field snmp-enable-switch">
                <input id="snmp_enabled" type="checkbox">
                <span class="snmp-switch" aria-hidden="true"></span>
                <span class="snmp-enable-text">
                    <strong>Ativar SNMP</strong>
                    <small>Usar community netspot</small>
                </span>
            </label>
            <button type="submit">Cadastrar</button>
        </form>
    </article>
</section>

<section class="panel-section">
    <article class="overview-card">
        <h2>Descoberta de Rede (LAN)</h2>
        <div class="network-discovery-form">
            <input id="discoverSubnet" placeholder="Subnet CIDR (ex.: 192.168.0.0/24)">
            <button id="discoverBtn" type="button">Descobrir rede</button>
        </div>
        <div id="networkDiscoveryInfo" class="network-discovery-info" aria-live="polite"></div>
        <div id="networkDiscoveryList" class="network-discovery-list">
            <small>Nenhuma descoberta executada.</small>
        </div>
        <div class="network-discovery-actions">
            <button id="importSelectedBtn" type="button">Adicionar selecionados</button>
        </div>
        <div id="networkImportResult" class="network-import-result" aria-live="polite"></div>
    </article>
</section>

<section class="panel-section">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Filtrar por nome ou IP..." onkeyup="filterHosts()">
        <select id="statusFilter" onchange="filterHosts()">
            <option value="all">Todos os Status</option>
            <option value="bg-success">Online</option>
            <option value="bg-danger">Offline</option>
            <option value="bg-warning">Degradado</option>
        </select>
    </div>
    <div class="hosts-toolbar">
      <div class="hosts-toolbar-main">
        <h2>Hosts</h2>
        <button id="openTrashBtn" class="trash-open-btn" title="Abrir lixeira" aria-label="Abrir lixeira">
            <span class="btn-icon-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1 2h4v2H4V6h4l1-2zm-2 6h2v8H7v-8zm4 0h2v8h-2v-8zm4 0h2v8h-2v-8z"/></svg>
            </span>
            Lixeira
        </button>
      </div>
      <button id="refreshBtn">Atualizar Lista</button>
    </div>
    <div id="hosts"></div>
</section>

<div id="toastContainer" class="toast-container"></div>

    <div id="alert-container"></div>

<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h3>Editar Host</h3>

    <input id="modal-name" disabled>
    <input id="modal-ip" placeholder="Endereco/IP">
    <input id="modal-http-url" placeholder="URL HTTP (opcional)">
    <label class="snmp-enable-field snmp-enable-switch">
      <input id="modal-http-enabled" type="checkbox">
      <span class="snmp-switch" aria-hidden="true"></span>
      <span class="snmp-enable-text">
        <strong>Check HTTP/HTTPS</strong>
        <small>Ativa monitoramento web</small>
      </span>
    </label>
    <div id="modalPortsField" class="ports-field">
      <div class="ports-field-head">
        <span>Portas TCP</span>
        <button id="modalAddPortBtn" type="button" class="add-port-btn" title="Adicionar porta" aria-label="Adicionar porta">+</button>
      </div>
      <div id="modalPortsContainer" class="ports-container"></div>
    </div>
    <label class="snmp-enable-field snmp-enable-switch">
      <input id="modal-snmp-enabled" type="checkbox">
      <span class="snmp-switch" aria-hidden="true"></span>
      <span class="snmp-enable-text">
        <strong>Ativar SNMP</strong>
        <small>Usar community netspot</small>
      </span>
    </label>

    <div class="modal-actions">
      <button type="button" onclick="submitModalEdit()">Salvar</button>
      <button type="button" onclick="closeModal()">Cancelar</button>
    </div>

  </div>
</div>

<div id="changePwdModal" class="modal hidden">
  <div class="modal-content">

    <h3>Alterar Senha</h3>

    <input id="current-pwd" type="password" placeholder="Senha atual">
    <input id="new-pwd" type="password" placeholder="Nova senha">
    <input id="confirm-pwd" type="password" placeholder="Confirmar nova senha">

    <div class="modal-actions">
      <button type="button" onclick="changePassword()">Alterar</button>
      <button type="button" onclick="closeChangePwdModal()">Cancelar</button>
    </div>

  </div>
</div>

<div id="trashModal" class="modal hidden">
  <div class="modal-content trash-modal-content">
    <div class="trash-modal-header">
      <h3>Lixeira</h3>
      <button class="modal-close-btn" onclick="closeTrashModal()" aria-label="Fechar lixeira">×</button>
    </div>
    <div class="trash-modal-toolbar">
      <button id="refreshTrashBtn">Atualizar lista</button>
    </div>
    <div id="trashHostsList" class="trash-list"></div>
  </div>
</div>

</div>

<div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
<aside id="sidebarMenu" class="sidebar-menu hidden" aria-hidden="true">
    <div class="sidebar-header">
        <strong>Conta</strong>
        <button id="closeMenuBtn" class="sidebar-close-btn icon-btn nav" type="button" title="Fechar menu" aria-label="Fechar menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </div>
    <div class="sidebar-actions">
        <button id="changePasswordBtn" type="button">
            <span class="btn-icon-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 116 0v3H9zm3 3a2 2 0 012 2 2 2 0 11-2-2z"/></svg>
            </span>
            Alterar Senha
        </button>
        <button id="logoutBtn" type="button">
            <span class="btn-icon-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/></svg>
            </span>
            Sair do Sistema
        </button>
    </div>
</aside>
</body>
<script src="app.js"></script>
</html>
