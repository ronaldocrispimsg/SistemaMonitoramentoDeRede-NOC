<!DOCTYPE html>
<html lang="pt-br">
<head>
<script>
  if (!localStorage.getItem("token")) {
      window.location.replace("login.html");
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSpot - Incidentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  (function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
          document.documentElement.classList.add("dark-theme");
      }
  })();
</script>
</head>
<body>
<header class="app-topbar">
    <div class="app-topbar-inner">
        <div class="hero-copy app-topbar-title">
            <a href="dashboard.html" class="app-logo-link" title="Ir para o início">
                <img src="images/logo/Prancheta 1.png" alt="NetSpot" class="app-logo logo-light">
                <img src="images/logo/Prancheta 2.png" alt="NetSpot" class="app-logo logo-dark">
            </a>
            <span class="page-subtitle">/ Incidentes</span>
        </div>
        <button id="themeToggleBtn" class="theme-switch-pill" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">
            <svg class="theme-switch-icon-sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="theme-switch-icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9 9.75 9.75 0 00-.67-3.4 6.78 6.78 0 01-7.93-7.93A9.75 9.75 0 0012 3z"/></svg>
            <span class="theme-switch-thumb">
                <svg id="themeToggleIcon" viewBox="0 0 24 24" width="14" height="14"></svg>
            </span>
        </button>
        <a class="toolbar-link-btn icon-btn nav" href="dashboard.html" title="Voltar ao dashboard" aria-label="Voltar ao dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6M8 12h12"/></svg>
        </a>
    </div>
</header>

<div class="container app-content">

    <section class="panel-section">
        <article class="overview-card incidents-page-card">
            <div class="incidents-toolbar">
                <input id="incidentsSearch" type="text" placeholder="Buscar por nome do host...">
            </div>
            <div id="incidentsList" class="incidents-list" aria-live="polite">
                <small>Carregando incidentes...</small>
            </div>
        </article>
    </section>
</div>
<script src="incidents.js"></script>
</body>
</html>
