<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSpot - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
          document.documentElement.classList.add("dark-theme");
      }
  })();
</script>
</head>

<body class="login-page">

<div class="login-box">

<div class="login-logo-container">
    <img src="images/logo/Prancheta 3.png" alt="NetSpot" class="login-logo">
</div>
<p class="login-subtitle">Painel de monitoramento e alertas</p>

<form id="loginForm">
    <input id="username" placeholder="Usuário" required>
    <input id="password" type="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
</form>

</div>

<div id="toastContainer" class="toast-container"></div>

<div id="pwdModal" class="modal hidden">
  <div class="modal-content">
    <h3>Troca de Senha Obrigatória</h3>
    <p>Primeiro acesso detectado. Por favor, escolha uma nova senha.</p>
    <input id="new-pwd" type="password" placeholder="Nova senha">
    <input id="confirm-pwd" type="password" placeholder="Confirmar senha">
    <div class="modal-actions">
      <button type="button" onclick="submitChangePassword()">Alterar senha e Entrar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
