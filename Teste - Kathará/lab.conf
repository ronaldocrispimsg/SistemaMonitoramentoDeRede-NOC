## Comecemos com o roteador principal kkkkk
router_core[0]=NETSPOT
router_core[bridged]=true
router_core[1]=ROTEADOR1
router_core[2]=ROTEADOR2
router_core[3]=ROTEADOR3
router_core[exec]=sysctl -w net.ipv4.ip_forward=1
router_core[exec]=ifconfig eth4 up
router_core[exec]=dhclient eth4
router_core[exec]=ifconfig eth1 100.0.1.254/24
router_core[exec]=ifconfig eth2 100.0.2.254/24
router_core[exec]=ifconfig eth3 100.0.3.254/24
router_core[exec]=iptables -t nat -A POSTROUTING -o eth4 -j MASQUERADE
router_core[exec]=route add -net 10.0.1.0/24 gw 100.0.1.1
router_core[exec]=route add -net 10.0.2.0/24 gw 100.0.2.1
router_core[exec]=route add -net 10.0.3.0/24 gw 100.0.3.1

